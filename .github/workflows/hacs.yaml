name: HACS

# No schedule trigger on purpose: GitHub disables any workflow that has one
# after 60 days without repository activity, and a disabled workflow stops
# running on push and pull_request too.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
